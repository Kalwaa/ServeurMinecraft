<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Console Pterodactyl</title>
  <style>
    body { font-family: monospace; background: #181825; color: #cdd6f4; padding: 20px; }
    #console {
      background: #11111b;
      color: #a6e3a1;
      padding: 15px;
      border-radius: 8px;
      height: 350px;
      overflow-y: auto;
      white-space: pre-wrap;
      border: 1px solid #313244;
    }
  </style>
</head>
<body>

  <h2>Console en Direct</h2>
  <div id="console">Connexion à la console...</div>

  <script>
    const SERVER_ID = 'TON_SERVER_ID_ICI';
    const consoleElem = document.getElementById('console');

    async function initConsole() {
      try {
        // 1. Demander le jeton WebSocket à ton backend
        const res = await fetch(`http://localhost:3000/api/servers/${SERVER_ID}/websockets`);
        const { token, socket } = await res.json();

        // 2. Ouvrir la connexion WebSocket directe vers Pterodactyl
        const ws = new WebSocket(socket);

        ws.onopen = () => {
          consoleElem.innerText = "Connecté à la console !\n";
          // S'authentifier auprès du WebSocket avec le jeton
          ws.send(JSON.stringify({
            event: 'auth',
            args: [token]
          }));
        };

        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);

          // L'événement 'console output' contient les lignes de logs du serveur
          if (data.event === 'console output') {
            consoleElem.innerText += data.args[0] + '\n';
            consoleElem.scrollTop = consoleElem.scrollHeight; // Défilement automatique vers le bas
          }
        };

        ws.onerror = (err) => {
          consoleElem.innerText += "\n[Erreur WebSocket]";
        };

        ws.onclose = () => {
          consoleElem.innerText += "\n[Connexion fermée]";
        };

      } catch (err) {
        consoleElem.innerText = "Impossible de charger la console.";
      }
    }

    initConsole();
  </script>
</body>
</html>
